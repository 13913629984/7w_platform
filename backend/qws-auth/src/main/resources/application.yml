server:
  port: 8090
spring:
  application:
    name: qws-auth
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: QWS
        group: QWS_GROUP
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/7wsys?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
jwt:
  secret: ${JWT_SECRET:qws-platform-secret-key-for-jwt-demo-2026}

# 认证服务是网关之前的入口（/auth/login 在网关白名单内，不带内部签名），
# 因此本服务不做内部签名校验，由网关对其它服务的调用负责。
qws:
  security:
    require-signature: false

# actuator：只暴露 health/info，供启动脚本与网关做就绪探测。
# 之前这些服务没有健康端点，启动脚本只能探端口，容易把「端口已开但 Spring 未就绪」当成可用。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
