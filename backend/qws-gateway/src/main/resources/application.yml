server:
  port: 8080
spring:
  application:
    name: qws-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: QWS
        group: QWS_GROUP
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4000}
            allowedMethods: '*'
            allowedHeaders: '*'
            allowCredentials: true
      routes:
        - id: qws-auth
          uri: lb://qws-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        # 系统管理。历史上这里还有一条无 StripPrefix 的 /system/** 路由，
        # 导致同一份接口有两个入口、且 JwtAuthFilter 要写兼容分支去猜路径形态。
        # 前端 baseURL 固定为 /api，已确认没有调用方走无前缀路径，故只保留一条。
        - id: qws-system
          uri: lb://qws-system
          predicates:
            - Path=/api/system/**
          filters:
            - StripPrefix=1
        - id: qws-crm
          uri: lb://qws-crm
          predicates:
            - Path=/api/crm/**
          filters:
            - StripPrefix=1
        - id: qws-wms
          uri: lb://qws-wms
          predicates:
            - Path=/api/wms/**
          filters:
            - StripPrefix=1
        - id: qws-fin
          uri: lb://qws-fin
          predicates:
            - Path=/api/fin/**
          filters:
            - StripPrefix=1
        - id: qws-maint
          uri: lb://qws-maint
          predicates:
            - Path=/api/maint/**
          filters:
            - StripPrefix=1
        - id: qws-ets
          uri: lb://qws-ets
          predicates:
            - Path=/api/ets/**
          filters:
            - StripPrefix=1
management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway

jwt:
  secret: ${JWT_SECRET:qws-platform-secret-key-for-jwt-demo-2026}
  # 免鉴权路径，逗号分隔，支持 Ant 风格
  whitelist: /api/auth/login,/api/auth/profile,/actuator/**

