name: CI

# 触发时机：
# - push 到主干分支
# - 所有 PR
# 之前仓库没有任何 CI，改动是否破坏编译/类型/单测全靠人肉验证。
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

# 同一分支有新提交时取消上一轮，避免浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端编译 + 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: mvn test（含 qws-common 单元测试）
        working-directory: backend
        # 只跑不依赖数据库的测试。集成测试需要 MySQL + Nacos，
        # 放在下面的 e2e job 里用真实服务栈跑。
        run: mvn -B -ntp test

      - name: 打包（跳过测试，测试已在上一步跑过）
        working-directory: backend
        run: mvn -B -ntp package -DskipTests

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: backend/*/target/*.jar
          retention-days: 3

  frontend:
    name: 前端类型检查 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: TypeScript 类型检查
        working-directory: frontend
        # vue-tsc -b 会检查所有 .vue + .ts 的类型。
        # 这一步能挡住"接口字段改名但视图没跟着改"这类错误。
        run: npx vue-tsc -b

      - name: 生产构建
        working-directory: frontend
        run: npm run build

  mobile:
    name: 移动端构建 (uni-app H5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 安装依赖
        working-directory: mobile
        run: npm ci

      - name: H5 构建
        working-directory: mobile
        # 小程序端（build:mp-weixin）需要微信开发者工具，CI 只验证 H5 能编译。
        # 依赖里用的是 uni-app alpha 版本，构建失败时优先怀疑依赖升级。
        run: npm run build:h5

  # 完整链路 e2e：起 MySQL + 全部微服务 + 前端，跑 smoke test。  # 依赖 MySQL service container；Nacos 这里用 standalone 不方便，
  # 所以把服务配置里的 nacos 注册当可选（服务本身能启，网关用直连 URL 兜底）。
  e2e:
    name: 端到端冒烟（MySQL + 服务栈）
    runs-on: ubuntu-latest
    needs: [ backend, frontend, mobile ]
    # 需要真实环境，默认只在手动触发时跑，避免每次 PR 都等 10 分钟
    if: github.event_name == 'workflow_dispatch'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: 7wsys
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 下载后端产物
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: backend-out

      - name: 启动各微服务
        run: |
          set -e
          # 服务启动顺序：auth/system 先起（建表 + 种子数据），其余随后，网关最后
          for svc in auth system crm wms fin maint ets; do
            jar=$(find backend-out -name "qws-$svc-*.jar" | head -1)
            echo "[start] $svc <- $jar"
            nohup java -jar "$jar" > "logs-$svc.txt" 2>&1 &
          done
          # 等所有服务的 actuator 健康
          for port in 8090 8091 8092 8093 8094 8095 8096; do
            echo "[wait] :$port"
            for i in $(seq 1 90); do
              if curl -sf "http://localhost:$port/actuator/health" | grep -q UP; then
                echo "  healthy after ${i}s"; break
              fi
              sleep 1
            done
          done
          gateway=$(find backend-out -name "qws-gateway-*.jar" | head -1)
          nohup java -jar "$gateway" > logs-gateway.txt 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health | grep -q UP; then echo "gateway healthy"; break; fi
            sleep 1
          done

      - name: 跑 API 冒烟测试
        env:
          PYTHONIOENCODING: utf-8
        run: python3 scripts/smoke_test.py --write

      - name: 失败时输出服务日志
        if: failure()
        run: |
          for f in logs-*.txt; do
            echo "===== $f ====="
            tail -60 "$f"
          done
